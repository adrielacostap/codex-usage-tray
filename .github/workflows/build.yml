name: build
on:
  push:
  pull_request:
jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/CodexUsageTray.Tests/CodexUsageTray.Tests.csproj -c Release
      - run: dotnet publish src/CodexUsageTray/CodexUsageTray.csproj -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: codex-usage-tray-win-x64
          path: dist/CodexUsageTray.exe
